name: auratalk-226

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  synapse-init:
    image: matrixdotorg/synapse:v1.141.0
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/homeserver.yaml ]; then
          /start.py generate
        fi
        cat > /data/overrides.yaml <<'YAML'
        database:
          name: psycopg2
          args:
            user: synapse
            password: ${POSTGRES_PASSWORD}
            database: synapse
            host: postgres
            port: 5432
            cp_min: 5
            cp_max: 10
        enable_registration: false
        federation_domain_whitelist: []
        YAML
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?Définir MATRIX_SERVER_NAME dans .env}
      SYNAPSE_REPORT_STATS: "no"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes: [synapse_data:/data]
    networks: [backend]

  synapse:
    image: matrixdotorg/synapse:v1.141.0
    restart: unless-stopped
    command:
      - run
      - --config-path=/data/homeserver.yaml
      - --config-path=/data/overrides.yaml
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes: [synapse_data:/data]
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose: ["8008"]
    networks: [backend]

  element:
    image: vectorim/element-web:v1.11.110
    restart: unless-stopped
    volumes: [./element/config.json:/app/config.json:ro]
    expose: ["80"]
    networks: [backend]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      SYNAPSE_URL: http://synapse:8008
      SYNAPSE_ADMIN_TOKEN: ${SYNAPSE_ADMIN_TOKEN:?Définir SYNAPSE_ADMIN_TOKEN dans .env}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Définir MATRIX_SERVER_NAME dans .env}
      REDIS_URL: redis://redis:6379
      REVOCATION_API_KEY: ${REVOCATION_API_KEY:?Définir REVOCATION_API_KEY dans .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Définir TOTP_ENCRYPTION_KEY dans .env}
    depends_on:
      redis:
        condition: service_healthy
      synapse:
        condition: service_started
    expose: ["3000"]
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [synapse, element, api]
    networks: [backend]

volumes:
  postgres_data:
  redis_data:
  synapse_data:

networks:
  backend:
    driver: bridge
