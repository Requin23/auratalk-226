name: auratalk-226

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  synapse-init:
    image: matrixdotorg/synapse:v1.141.0
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/homeserver.yaml ]; then
          /start.py generate
        fi
        cat > /data/overrides.yaml <<'YAML'
        database:
          name: psycopg2
          args:
            user: synapse
            password: ${POSTGRES_PASSWORD}
            database: synapse
            host: postgres
            port: 5432
            cp_min: 5
            cp_max: 10
        enable_registration: false
        federation_domain_whitelist: []
        encryption_enabled_by_default_for_room_type: all
        modules:
          - module: encryption_policy.RequireEncryptedTimelineEvents
        YAML
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?Définir MATRIX_SERVER_NAME dans .env}
      SYNAPSE_REPORT_STATS: "no"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes: [synapse_data:/data]
    networks: [backend]

  synapse:
    image: matrixdotorg/synapse:v1.141.0
    restart: unless-stopped
    command:
      - run
      - --config-path=/data/homeserver.yaml
      - --config-path=/data/overrides.yaml
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      PYTHONPATH: /modules
    volumes:
      - synapse_data:/data
      - ./synapse/encryption_policy.py:/modules/encryption_policy.py:ro
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose: ["8008"]
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  synapse-admin-bootstrap:
    image: matrixdotorg/synapse:v1.141.0
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/.auratalk-admin-created ]; then
          printf '%s' "$SYNAPSE_ADMIN_PASSWORD" > /tmp/admin-password
          register_new_matrix_user http://synapse:8008 -c /data/homeserver.yaml -u "$SYNAPSE_ADMIN_USER" --password-file /tmp/admin-password --admin --exists-ok
          rm -f /tmp/admin-password
          touch /data/.auratalk-admin-created
        fi
    environment:
      SYNAPSE_ADMIN_USER: ${SYNAPSE_ADMIN_USER:-auratalk-admin}
      SYNAPSE_ADMIN_PASSWORD: ${SYNAPSE_ADMIN_PASSWORD:?Définir SYNAPSE_ADMIN_PASSWORD dans .env}
    volumes: [synapse_data:/data]
    depends_on:
      synapse:
        condition: service_healthy
    networks: [backend]

  pwa:
    build: ./client
    restart: unless-stopped
    expose: ["80"]
    networks: [backend]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      SYNAPSE_URL: http://synapse:8008
      SYNAPSE_ADMIN_USER: ${SYNAPSE_ADMIN_USER:-auratalk-admin}
      SYNAPSE_ADMIN_PASSWORD: ${SYNAPSE_ADMIN_PASSWORD:?Définir SYNAPSE_ADMIN_PASSWORD dans .env}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Définir MATRIX_SERVER_NAME dans .env}
      REDIS_URL: redis://redis:6379
      REVOCATION_API_KEY: ${REVOCATION_API_KEY:?Définir REVOCATION_API_KEY dans .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Définir TOTP_ENCRYPTION_KEY dans .env}
    depends_on:
      redis:
        condition: service_healthy
      synapse:
        condition: service_healthy
      synapse-admin-bootstrap:
        condition: service_completed_successfully
    expose: ["3000"]
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [synapse, pwa, api]
    networks: [backend]

volumes:
  postgres_data:
  redis_data:
  synapse_data:

networks:
  backend:
    driver: bridge
